# Save this file at: .github/workflows/fetch-plays.yml
#
# GitHub's cron is best-effort (a */5 schedule can silently not fire for
# 25+ min — observed 2026-07-11). So instead of one fetch per tick, each
# run LOOPS for ~90 min, fetching every 4 min. The schedule only needs to
# land one run per 90 min to keep data continuously fresh; concurrency
# hands the loop over to the newest run.
#
# Data goes to the 'plays' branch as a single force-pushed commit, so
# main's history stays clean and GitHub Pages never rebuilds for data.

name: Fetch plays

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}      # manual kick-off from the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch-plays
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cloudscraper
        run: pip install cloudscraper

      - name: Fetch loop (every 4 min for ~90 min)
        run: |
          git config user.name "onair-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B plays
          committed=0
          consec=0
          end=$((SECONDS + 5400))
          while [ "$SECONDS" -lt "$end" ]; do
            if python fetch_plays.py; then
              consec=0
              git add data
              if ! git diff --cached --quiet; then
                if [ "$committed" = "1" ]; then
                  git commit --amend --quiet -m "update plays"
                else
                  git commit --quiet -m "update plays"
                  committed=1
                fi
                git push --force --quiet origin plays || echo "push failed; retrying next cycle"
              fi
            else
              consec=$((consec + 1))
              echo "fetch failed ($consec consecutive)"
              if [ "$consec" -ge 5 ]; then
                echo "::error::xmplaylist unreachable for 5 consecutive attempts"
                exit 1
              fi
            fi
            sleep 240
          done
          echo "loop finished — next scheduled run takes over"
