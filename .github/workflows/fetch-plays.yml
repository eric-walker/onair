# Save this file at: .github/workflows/fetch-plays.yml
name: Fetch plays

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay a few min)
  workflow_dispatch: {}      # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: fetch-plays
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cloudscraper
        run: pip install cloudscraper

      - name: Fetch playlists
        run: python fetch_plays.py

      - name: Commit updated data
        run: |
          git config user.name "onair-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "update plays"
          git push
